<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowVault - Admin Panel</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a051b;
      --card-bg: rgba(25, 12, 48, 0.75);
      --purple-primary: #8a2be2;
      --purple-glow: #b15eff;
      --purple-accent: #1e0938;
      --text-light: #f1e9ff;
      --text-muted: #a395c9;
      --border-color: rgba(177, 94, 255, 0.25);
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Water Flow BG */
    .water-flow-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 50% 20%, #17042c 0%, #0a051b 80%);
    }

    /* Login Screen */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 27, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-box {
      background: var(--card-bg);
      border: 1px solid var(--purple-glow);
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 35px rgba(138, 43, 226, 0.4);
    }

    /* Main Header */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 5, 27, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i { color: var(--purple-glow); }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn-nav:hover {
      color: #fff;
      border-color: var(--purple-glow);
    }

    .container {
      max-width: 1100px;
      width: 90%;
      margin: 30px auto;
    }

    /* Stats Dashboard */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(138, 43, 226, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--purple-glow);
    }

    .stat-info h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .stat-info span {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    /* Forms & Panel Layout */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .panel-header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(10, 5, 27, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: var(--purple-glow);
      box-shadow: 0 0 10px rgba(177, 94, 255, 0.3);
    }

    .btn-submit {
      padding: 12px 25px;
      background: linear-gradient(135deg, var(--purple-primary), var(--purple-glow));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-submit:hover {
      filter: brightness(1.15);
    }

    /* Table */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .thumb-preview {
      width: 50px;
      height: 35px;
      border-radius: 6px;
      object-fit: cover;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-edit { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
    .btn-edit:hover { background: #f1c40f; color: #000; }

    .btn-delete { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    .btn-delete:hover { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <div class="water-flow-bg"></div>

  <!-- Security Passcode Modal -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <i class="fa-solid fa-shield-halved fa-3x" style="color: var(--purple-glow); margin-bottom: 15px;"></i>
      <h3 style="color: #fff; margin-bottom: 10px;">Admin Access</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Enter security passcode to unlock</p>
      
      <div class="form-group">
        <input type="password" id="passInput" class="form-control" placeholder="Enter Passcode" style="text-align: center;">
      </div>
      <button class="btn-submit" style="width: 100%;" onclick="verifyPasscode()">Unlock Dashboard</button>
      <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px; display: none;">Incorrect Passcode!</p>
    </div>
  </div>

  <header>
    <div class="logo">
      <i class="fa-solid fa-user-shield"></i> FlowVault Admin
    </div>
    <div>
      <a href="index.html" class="btn-nav"><i class="fa-solid fa-globe"></i> View Website</a>
      <button class="btn-nav" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Lock</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Real-time Meter Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-file"></i></div>
        <div class="stat-info">
          <h4>Total Files</h4>
          <span id="totalFilesMeter">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-regular fa-eye"></i></div>
        <div class="stat-info">
          <h4>Total Views</h4>
          <span id="totalViewsMeter">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-download"></i></div>
        <div class="stat-info">
          <h4>Total Downloads</h4>
          <span id="totalClicksMeter">0</span>
        </div>
      </div>
    </div>

    <!-- Security Settings Customization -->
    <div class="panel-card">
      <div class="panel-header">
        <span><i class="fa-solid fa-key"></i> Passcode Security Settings</span>
      </div>
      <div style="display: flex; gap: 15px; align-items: flex-end;">
        <div class="form-group" style="flex: 1; margin: 0;">
          <label>Update Admin Security Passcode</label>
          <input type="password" id="newPasscode" class="form-control" placeholder="New Passcode">
        </div>
        <button class="btn-submit" onclick="updatePasscode()">Save Passcode</button>
      </div>
    </div>

    <!-- Add/Edit File Form -->
    <div class="panel-card">
      <div class="panel-header">
        <span id="formTitle"><i class="fa-solid fa-plus-circle"></i> Add New File</span>
        <button class="btn-nav" id="cancelEditBtn" style="display: none;" onclick="resetForm()">Cancel Edit</button>
      </div>

      <input type="hidden" id="editFileId">
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
        <div class="form-group">
          <label>File Display Name</label>
          <input type="text" id="fileTitle" class="form-control" placeholder="e.g. Premium UI Kit ZIP">
        </div>
        <div class="form-group">
          <label>Image Thumbnail URL</label>
          <input type="url" id="fileThumb" class="form-control" placeholder="https://domain.com/image.jpg">
        </div>
      </div>

      <div class="form-group">
        <label>Direct Download URL</label>
        <input type="url" id="fileUrl" class="form-control" placeholder="https://domain.com/files/download.zip">
      </div>

      <button class="btn-submit" onclick="saveFile()"><i class="fa-solid fa-floppy-disk"></i> Save File</button>
    </div>

    <!-- File List Table -->
    <div class="panel-card">
      <div class="panel-header">
        <span><i class="fa-solid fa-list"></i> Managed Files Library</span>
      </div>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Thumbnail</th>
              <th>Title</th>
              <th>Views</th>
              <th>Clicks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_PASS = "admin123";
    let securityPasscode = localStorage.getItem('fv_passcode') || DEFAULT_PASS;
    let files = JSON.parse(localStorage.getItem('fv_files')) || [];

    // Lock System Initialization
    if (sessionStorage.getItem('fv_authenticated') === 'true') {
      document.getElementById('loginOverlay').style.display = 'none';
      initDashboard();
    }

    function verifyPasscode() {
      const input = document.getElementById('passInput').value;
      if (input === securityPasscode) {
        sessionStorage.setItem('fv_authenticated', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('loginError').style.display = 'none';
        initDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('fv_authenticated');
      location.reload();
    }

    function updatePasscode() {
      const newPass = document.getElementById('newPasscode').value.trim();
      if (!newPass) return alert("Passcode cannot be empty!");
      
      securityPasscode = newPass;
      localStorage.setItem('fv_passcode', securityPasscode);
      document.getElementById('newPasscode').value = '';
      alert("Security passcode successfully updated!");
    }

    function initDashboard() {
      renderMeters();
      renderAdminTable();
    }

    function renderMeters() {
      document.getElementById('totalFilesMeter').innerText = files.length;
      
      const totalViews = files.reduce((sum, f) => sum + (f.views || 0), 0);
      const totalClicks = files.reduce((sum, f) => sum + (f.clicks || 0), 0);

      document.getElementById('totalViewsMeter').innerText = totalViews;
      document.getElementById('totalClicksMeter').innerText = totalClicks;
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = '';

      if (files.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No files found in database.</td></tr>`;
        return;
      }

      files.forEach(file => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${file.thumb}" class="thumb-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
          <td><strong>${file.title}</strong></td>
          <td><i class="fa-regular fa-eye"></i> ${file.views}</td>
          <td><i class="fa-solid fa-download"></i> ${file.clicks}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon btn-edit" onclick="editFile('${file.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-icon btn-delete" onclick="deleteFile('${file.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function saveFile() {
      const id = document.getElementById('editFileId').value;
      const title = document.getElementById('fileTitle').value.trim();
      const thumb = document.getElementById('fileThumb').value.trim();
      const url = document.getElementById('fileUrl').value.trim();

      if (!title || !thumb || !url) {
        alert("Please fill in all fields!");
        return;
      }

      if (id) {
        // Edit Mode
        const file = files.find(f => f.id === id);
        if (file) {
          file.title = title;
          file.thumb = thumb;
          file.url = url;
        }
      } else {
        // Add Mode
        const newFile = {
          id: Date.now().toString(),
          title: title,
          thumb: thumb,
          url: url,
          views: 0,
          clicks: 0
        };
        files.push(newFile);
      }

      saveData();
      resetForm();
    }

    function editFile(id) {
      const file = files.find(f => f.id === id);
      if (!file) return;

      document.getElementById('editFileId').value = file.id;
      document.getElementById('fileTitle').value = file.title;
      document.getElementById('fileThumb').value = file.thumb;
      document.getElementById('fileUrl').value = file.url;

      document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen"></i> Edit File`;
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
    }

    function deleteFile(id) {
      if (confirm("Are you sure you want to delete this file entry?")) {
        files = files.filter(f => f.id !== id);
        saveData();
      }
    }

    function resetForm() {
      document.getElementById('editFileId').value = '';
      document.getElementById('fileTitle').value = '';
      document.getElementById('fileThumb').value = '';
      document.getElementById('fileUrl').value = '';

      document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus-circle"></i> Add New File`;
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function saveData() {
      localStorage.setItem('fv_files', JSON.stringify(files));
      initDashboard();
    }
  </script>
</body>
  </html>
